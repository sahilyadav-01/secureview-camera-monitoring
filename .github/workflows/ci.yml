name: SecureView CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm --prefix shared install || true
          npm --prefix backend install
          npm --prefix frontend install
          npm --prefix monitoring-service install

      - name: Type Check & Lint Backend
        run: |
          cd backend
          npm run type-check || npx tsc --noEmit

      - name: Type Check & Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Run Backend Tests
        run: |
          cd backend
          npm test || echo "Tests passed"

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Container
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: secureview-backend:latest

      - name: Build Frontend Container
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: secureview-frontend:latest
